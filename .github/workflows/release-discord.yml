name: Announce release on Discord

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Post release to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name }}
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          DLL_NAME: Qubit.dll
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret is not set, skipping."
            exit 0
          fi

          VERSION="${RELEASE_NAME:-$TAG}"

          # embed descriptions are capped at 4096 characters
          DESCRIPTION="$(printf '%s' "$BODY" | head -c 3900)"
          [ "${#BODY}" -gt 3900 ] && DESCRIPTION="${DESCRIPTION}..."
          [ -z "$DESCRIPTION" ] && DESCRIPTION="No release notes were provided."

          PAYLOAD="$(jq -n \
            --arg version "$VERSION" \
            --arg description "$DESCRIPTION" \
            --arg release_url "$RELEASE_URL" \
            --arg repo_url "$REPO_URL" \
            --arg download_url "$REPO_URL/releases/download/$TAG/$DLL_NAME" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              content: "@everyone",
              allowed_mentions: { parse: ["everyone"] },
              embeds: [
                {
                  title: ("Qubit " + $version),
                  url: $release_url,
                  description: $description,
                  color: 11166975,
                  timestamp: $timestamp
                },
                {
                  description: "Download the latest build or browse the source code below.",
                  color: 11166975
                }
              ],
              components: [
                {
                  type: 1,
                  components: [
                    { type: 2, style: 5, label: ("Download " + $version), url: $download_url },
                    { type: 2, style: 5, label: "Source Code", url: $repo_url }
                  ]
                }
              ]
            }')"

          # with_components lets a plain webhook send link buttons
          curl --fail-with-body -sS -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "${WEBHOOK}?with_components=true"
